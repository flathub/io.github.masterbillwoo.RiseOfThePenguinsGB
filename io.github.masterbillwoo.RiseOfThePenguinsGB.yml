app-id: io.github.masterbillwoo.RiseOfThePenguinsGB
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rise-of-the-penguins-gb-wrapper

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: rise-of-the-penguins-gb
    buildsystem: simple
    build-commands:
      - install -Dm755 "rise of the penguins gb.$FLATPAK_ARCH" /app/bin/rise-of-the-penguins-gb.bin
      - install -Dm644 "rise of the penguins gb.pck" /app/bin/rise-of-the-penguins-gb.bin.pck
      - ln -s rise-of-the-penguins-gb.bin.pck /app/bin/rise-of-the-penguins-gb.pck
      - install -Dm644 addons/godot_boy/godot_boy.gdextension /app/bin/addons/godot_boy/godot_boy.gdextension
      - install -Dm755 addons/godot_boy/libgodot_boy.linux.$FLATPAK_ARCH.so -t /app/bin/addons/godot_boy
      - install -Dm755 addons/godot_boy/libgodot_boy.linux.$FLATPAK_ARCH.so -t /app/bin
      - install -Dm755 rise-of-the-penguins-gb-wrapper.sh /app/bin/rise-of-the-penguins-gb-wrapper
      - install -Dm755 rise-of-the-penguins-gb-wrapper.sh /app/bin/rise-of-the-penguins-gb
      - install -Dm644 io.github.masterbillwoo.RiseOfThePenguinsGB.desktop /app/share/applications/io.github.masterbillwoo.RiseOfThePenguinsGB.desktop
      - install -Dm644 io.github.masterbillwoo.RiseOfThePenguinsGB.metainfo.xml /app/share/metainfo/io.github.masterbillwoo.RiseOfThePenguinsGB.metainfo.xml
      - install -Dm644 icons/256x256.png /app/share/icons/hicolor/256x256/apps/io.github.masterbillwoo.RiseOfThePenguinsGB.png
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.masterbillwoo.RiseOfThePenguinsGB.png
      - install -Dm644 icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.masterbillwoo.RiseOfThePenguinsGB.png
    sources:
      - type: archive
        url: https://github.com/masterbillwoo/riseofthepenguinsgb/raw/c07330a4a6246c3e81e4807ce9aef5574988a174/rise-of-the-penguins-gb-linux-x86_64-v1.0.11.zip
        sha256: 4cc195f34081e3fffadf7ab3388851a0043f6294d32421acaceeec17e1a4ddf0
        strip-components: 0
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/masterbillwoo/riseofthepenguinsgb/raw/c07330a4a6246c3e81e4807ce9aef5574988a174/rise-of-the-penguins-gb-linux-aarch64-v1.0.11.zip
        sha256: 51c32e07a3955fc121624a697e07793625178032909e1da68d5bfacc0904a431
        strip-components: 0
        only-arches:
          - aarch64
      - type: file
        path: rise-of-the-penguins-gb-wrapper.sh